<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShariaScope - Screening Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            background-color: #0f1117;
            color: #ffffff;
        }
        .sharia-card {
            background-color: #1a1d2e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <div class="max-w-[800px] mx-auto pt-16 pb-12 px-4" x-data="reportApp()" x-init="initApp()">
        
        <template x-if="!loaded">
            <div class="text-center text-gray-400 mt-20">Loading report data...</div>
        </template>
        
        <template x-if="loaded">
            <div>
                <!-- Header -->
                <h1 class="text-4xl md:text-5xl font-bold text-white tracking-wider text-center mb-6 flex flex-col items-center gap-3">
                    <span x-text="company_name"></span>
                </h1>
                
                <!-- Auto Collection Banner -->
                <template x-if="auto_collected_fields">
                    <div class="bg-amber-900/30 border border-amber-500/30 rounded-xl p-5 mb-8 max-w-2xl mx-auto flex flex-col items-center text-center shadow-lg">
                        <div class="flex items-center gap-2 text-amber-400 font-bold text-lg mb-2">
                            <span>⚠️</span>
                            <span>Auto Mode — Data Accuracy Not Guaranteed</span>
                        </div>
                        <p class="text-gray-300 text-sm mb-4" x-text="auto_collected_fields"></p>
                        
                        <div class="flex items-center gap-2 mb-4">
                            <span class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Data Confidence:</span>
                            <span class="text-xs px-3 py-1 rounded-full uppercase tracking-widest font-semibold border"
                                  :class="{
                                      'bg-emerald-900/50 text-emerald-400 border-emerald-500/50': data_confidence === 'high',
                                      'bg-amber-900/50 text-amber-400 border-amber-500/50': data_confidence === 'medium',
                                      'bg-red-900/50 text-red-400 border-red-500/50': data_confidence === 'low'
                                  }" x-text="data_confidence">
                            </span>
                        </div>
                        
                        <button @click="screenAnother" class="text-xs font-semibold text-blue-400 hover:text-blue-300 underline transition-colors">
                            Switch to Manual Mode for accurate results
                        </button>
                    </div>
                </template>

                <!-- Verdict Banner -->
                <div class="rounded-xl p-4 md:p-6 mb-8 shadow-lg text-center flex items-center justify-center gap-3 font-bold text-xl md:text-2xl"
                     :class="{
                         'bg-emerald-600/20 text-emerald-400 border border-emerald-500/30': verdict === 'COMPLIANT',
                         'bg-red-600/20 text-red-400 border border-red-500/30': verdict === 'NON-COMPLIANT',
                         'bg-amber-600/20 text-amber-400 border border-amber-500/30': verdict === 'NEEDS SCHOLAR REVIEW'
                     }">
                    <span x-show="verdict === 'COMPLIANT'">✅</span>
                    <span x-show="verdict === 'NON-COMPLIANT'">❌</span>
                    <span x-show="verdict === 'NEEDS SCHOLAR REVIEW'">⚠️</span>
                    <span x-text="verdict"></span>
                </div>

                <!-- Metric Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <!-- Debt-to-Assets -->
                    <div class="glass-card rounded-xl p-6 text-center">
                        <div class="text-xs uppercase tracking-wider text-gray-400 mb-2 font-semibold">Debt-to-Assets Ratio</div>
                        <div class="text-4xl font-bold mb-2"
                             :class="{
                                 'text-emerald-400': debt_to_assets !== null && debt_to_assets <= 0.33,
                                 'text-red-400': debt_to_assets !== null && debt_to_assets > 0.33,
                                 'text-gray-500': debt_to_assets === null
                             }"
                             x-text="debt_to_assets !== null ? (debt_to_assets * 100).toFixed(1) + '%' : 'Missing'">
                        </div>
                        <div class="text-xs text-gray-500">Threshold: below 33%</div>
                    </div>
                    
                    <!-- Interest Income -->
                    <div class="glass-card rounded-xl p-6 text-center">
                        <div class="text-xs uppercase tracking-wider text-gray-400 mb-2 font-semibold">Interest Income Ratio</div>
                        <div class="text-4xl font-bold mb-2"
                             :class="{
                                 'text-emerald-400': interest_income_to_revenue !== null && interest_income_to_revenue <= 0.05,
                                 'text-red-400': interest_income_to_revenue !== null && interest_income_to_revenue > 0.05,
                                 'text-gray-500': interest_income_to_revenue === null
                             }"
                             x-text="interest_income_to_revenue !== null ? (interest_income_to_revenue * 100).toFixed(1) + '%' : 'Missing'">
                        </div>
                        <div class="text-xs text-gray-500">Threshold: below 5%</div>
                    </div>
                </div>

                <!-- Missing Fields Notice -->
                <template x-if="missing_fields && missing_fields.length > 0">
                    <div class="bg-amber-900/40 border border-amber-500/30 text-amber-200 rounded-lg p-4 mb-8 text-sm">
                        <strong>Note:</strong> The following data was not provided and has been estimated by the agent:
                        <span x-text="missing_fields.join(', ')"></span>
                    </div>
                </template>

                <!-- Sections -->
                <div class="space-y-6">
                    <template x-for="(section, index) in sections" :key="index">
                        <div class="glass-card rounded-xl p-6 fade-in-up" :class="'delay-' + (index + 1)">
                            <h3 class="text-xl font-bold text-gray-200 mb-4 flex items-center gap-3">
                                <span x-text="section.icon"></span>
                                <span x-text="section.title"></span>
                            </h3>
                            <div class="text-gray-300 leading-relaxed whitespace-pre-wrap" x-html="section.content"></div>
                        </div>
                    </template>
                </div>

                <!-- Footer Button -->
                <div class="mt-12 text-center">
                    <button @click="screenAnother" class="inline-block btn-gradient text-white font-bold py-4 px-10 rounded-lg transition-all duration-200 shadow-lg">
                        Screen Another Company
                    </button>
                </div>
            </div>
        </template>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('reportApp', () => ({
                loaded: false,
                company_name: '',
                debt_to_assets: null,
                interest_income_to_revenue: null,
                missing_fields: [],
                report: '',
                verdict: '',
                sections: [],
                auto_collected_fields: null,
                data_confidence: null,
                
                initApp() {
                    const dataStr = localStorage.getItem('shariascope_result');
                    if (!dataStr) {
                        window.location.href = '/';
                        return;
                    }
                    
                    try {
                        const data = JSON.parse(dataStr);
                        this.company_name = data.company_name || 'Unknown Company';
                        this.debt_to_assets = data.debt_to_assets;
                        this.interest_income_to_revenue = data.interest_income_to_revenue;
                        this.missing_fields = data.missing_fields || [];
                        this.report = data.report || '';
                        this.auto_collected_fields = data.auto_collected_fields || null;
                        this.data_confidence = data.data_confidence || null;
                        
                        this.parseVerdict();
                        this.parseSections();
                        
                        this.loaded = true;
                    } catch (e) {
                        console.error('Error loading report data', e);
                        window.location.href = '/';
                    }
                },
                
                parseVerdict() {
                    // Look for COMPLIANT, NON-COMPLIANT, or NEEDS SCHOLAR REVIEW after OVERALL VERDICT
                    const match = this.report.match(/OVERALL VERDICT\s*[:\n]+(COMPLIANT|NON-COMPLIANT|NEEDS SCHOLAR REVIEW)/i);
                    if (match && match[1]) {
                        this.verdict = match[1].toUpperCase();
                    } else {
                        this.verdict = "NEEDS SCHOLAR REVIEW"; // fallback
                    }
                },
                
                parseSections() {
                    const headers = [
                        { title: "OVERALL VERDICT", icon: "📋" },
                        { title: "BUSINESS ACTIVITY ASSESSMENT", icon: "🏢" },
                        { title: "FINANCIAL RATIO ANALYSIS", icon: "📊" },
                        { title: "EXCEPTION HANDLING AND EDGE CASES", icon: "⚖️" },
                        { title: "MISSING DATA ASSUMPTIONS", icon: "❓" },
                        { title: "PLAIN LANGUAGE SUMMARY", icon: "💬" }
                    ];
                    
                    let parsed = [];
                    
                    for (let i = 0; i < headers.length; i++) {
                        const currentHeader = headers[i].title;
                        const headerRegex = new RegExp(`(?:^|\\n)${currentHeader}\\s*[:\\n]+`, 'i');
                        
                        const match = this.report.match(headerRegex);
                        if (match) {
                            const startIndex = match.index + match[0].length;
                            let endIndex = this.report.length;
                            
                            // Find where the next header starts
                            for (let j = i + 1; j < headers.length; j++) {
                                const nextHeaderRegex = new RegExp(`(?:^|\\n)${headers[j].title}\\s*[:\\n]+`, 'i');
                                const nextMatch = this.report.substring(startIndex).match(nextHeaderRegex);
                                if (nextMatch) {
                                    endIndex = startIndex + nextMatch.index;
                                    break;
                                }
                            }
                            
                            let content = this.report.substring(startIndex, endIndex).trim();
                            // Optional: clean up leading/trailing asterisks or hashes
                            content = content.replace(/^[\*\#\-\s]+|[\*\#\-\s]+$/g, '');
                            
                            parsed.push({
                                title: currentHeader,
                                icon: headers[i].icon,
                                content: content
                            });
                        }
                    }
                    
                    this.sections = parsed;
                },
                
                screenAnother() {
                    localStorage.removeItem('shariascope_result');
                    window.location.href = '/';
                }
            }));
        });
    </script>
</body>
</html>
